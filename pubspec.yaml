name: road_construction_dashboard
description: Road Construction Monitoring Dashboard for government authorities.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5+1

  # Navigation
  go_router: ^17.0.0

  # Networking (mock/local JSON now, wired for REST later)
  dio: ^5.10.0

  # Charts
  fl_chart: ^0.69.2

  # Images
  cached_network_image: ^3.4.1

  # Formatting dates/numbers
  intl: ^0.20.2

  # --- Bonus features (outside the assessment's "allowed packages" list -
  # flagged explicitly in README.md as a deliberate scope extension) ---
  shared_preferences: ^2.3.2   # offline caching of last-fetched data
  pdf: ^3.11.1                 # building PDF documents
  printing: ^5.13.4            # PDF preview / share / save-to-device

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/mock_data.json
